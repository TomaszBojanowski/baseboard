[workspace]
members = ["crates/core", "crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# GNOME 50 (GTK 4.22, libadwaita 1.9) is the minimum.
gtk = { package = "gtk4", version = "0.11.5", features = ["gnome_50"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_9"] }
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
glib-build-tools = "0.22.8"
# The app's FFI modules: dlopen of libsensors and libudev, the locale.
libc = "0.2.191"
# Board profiles (TOML).
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[workspace.lints.rust]
# Unsafe code is allowed only in FFI modules, each of which opts in with
# `#![allow(unsafe_code, reason = "…")]` and documents every block with
# `// SAFETY:`.
unsafe_code = "deny"
unused_qualifications = "warn"

# Lints aimed at code nobody needs, not at style (docs/PROJEKT.md §8, Z1);
# clippy runs with `-D warnings`. A deliberate exception is an
# `#[expect(…, reason = "…")]` next to the code.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"
allow_attributes_without_reason = "warn"
match_same_arms = "warn"
option_option = "warn"
ref_option = "warn"
needless_pass_by_value = "warn"
unnecessary_wraps = "warn"
unused_self = "warn"
redundant_else = "warn"

[profile.release]
lto = "thin"
