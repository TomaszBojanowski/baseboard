# Publishes website/ on GitHub Pages (https://baseboard.bojanowski.me)
# after changes on main. The custom domain is set in the repository
# settings; website/CNAME names it as well. Actions are pinned to commits.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The website as the artifact "github-pages" of the run.
  build:
    # A version of the system, as the actions are pinned to commits.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website

  # The deployment in a job of its own, after the upload: deploy-pages
  # looks the artifact up by name at once, and right after the upload in
  # the same job the list of the run's artifacts can still be empty. A
  # failed deployment is re-run alone ("Re-run failed jobs"); re-running
  # the build too adds a second artifact of the same name, which
  # deploy-pages refuses.
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
