<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baseboard – Krzywa wentylatora (makieta)</title>
<link rel="stylesheet" href="wspolne.css">
<link rel="stylesheet" href="wentylatory.css">
</head>
<body data-page="wentylatory-krzywa" data-nav="wentylatory" data-back="1"
      data-title="Wentylator systemowy 1" data-subtitle="SYS_FAN1 · niezapisane zmiany">

<!--
  M2b: curve editor, an AdwNavigationPage pushed from the fan page. The
  controller has exactly 7 points (§5.5.4). ?stan= picks the state:
    (none)    an own curve being edited, not applied yet; the dashed line is
              the curve the controller runs now; the duty cycle of point 4 is
              being typed in;
    blad      the same after the controller refused the write;
    bios-cpu  the default CPU curve of the BIOS (§6.3), which breaks the
              minimum (B5): shown unchanged, point 1 marked, keyboard focus
              on the chart;
    podglad   driver without curve writes: preview only.
  temp1 46,0 °C is a real reading; the curves of SYS_FAN1 being edited are
  illustrative (wentylatory.js).
-->

<template id="banner">
  <span>Zmiany działają także po zamknięciu aplikacji, do restartu komputera</span>
  <span class="btn">Przywróć automat BIOS</span>
</template>

<template id="bottom-bar"></template>

<main id="content" class="page"></main>

<script src="wykres.js"></script>
<script src="wentylatory.js"></script>
<script>
(function () {
  const F = window.FANS;
  const { CH, P, C, pct, f1 } = F;
  const state = F.state;
  const body = document.body;

  let c = CH.sys1, points = F.USER_CURVE, ghost = F.OLD_CURVE, issues = {};
  let selected = 3, chartFocus = false, typing = 3;
  let now = { t: F.TEMP1, d: F.dutyAt(F.OLD_CURVE, F.TEMP1), target: F.dutyAt(F.USER_CURVE, F.TEMP1), aheadLabel: "po zastosowaniu" };
  // The subtitle says the changes are not saved and the legend says what the
  // dashed line is, so the default state needs no notice.
  let note = "";
  let bar = `<span class="btn flat"><i data-ic="restore"></i>Przywróć krzywą BIOS</span><span class="spacer"></span>
    <span class="btn">Cofnij zmiany</span><span class="btn suggested">Zastosuj</span>`;
  let editable = true;

  if (state === "blad") {
    typing = -1;
    note = F.notice("error", "error", "Kontroler płyty nie przyjął ustawień",
      "Obowiązuje poprzednia krzywa. Zmiany zostały w edytorze.");
  } else if (state === "bios-cpu") {
    c = CH.cpu1; points = F.BIOS_DEFAULT_CPU; ghost = null; selected = 0; chartFocus = true; typing = -1;
    issues = { 0: `Ustaw co najmniej ${P(c.min)}` };
    now = { t: F.TEMP1, d: F.dutyAt(points, F.TEMP1) };
    body.dataset.title = c.name;
    body.dataset.subtitle = "CPU_FAN1 · automat BIOS";
    note = F.notice("warning", "warning", "Ta krzywa nie spełnia zasad Baseboard", "Kontroler płyty wykonuje ją bez zmian.");
    bar = `<span class="caption dim">Popraw zaznaczony punkt, żeby zastosować krzywą.</span><span class="spacer"></span>
      <span class="btn disabled">Cofnij zmiany</span><span class="btn suggested disabled">Zastosuj</span>`;
  } else if (state === "podglad") {
    points = c.curve; ghost = null; selected = -1; editable = false; typing = -1;
    now = { t: F.TEMP1, d: c.duty };
    body.dataset.subtitle = "SYS_FAN1 · podgląd";
    note = F.notice("info", "info", "Edycja krzywych i wybór źródła wymagają nowszego sterownika jądra.", "");
    bar = "";
    document.getElementById("banner").remove();
  }
  document.getElementById("bottom-bar").innerHTML = bar;
  if (!bar) document.getElementById("bottom-bar").remove();

  const chartConf = {
    h: w => F.narrow ? 280 : Math.round(Math.min(390, w * 0.43)),
    points, ghost, min: c.min, threshold: F.THRESHOLD, needsFull: c.needsFull, source: F.SOURCE,
    now, handles: editable, selected, focus: chartFocus, issues,
    label: F.chartLabel(c, points),
  };
  const chart = F.chartBox(chartConf, "ed-plot");

  // Legend: only the marks the chart does not name itself. The values of
  // the operating point go here only when their label did not fit on the
  // chart (a narrow window).
  window.afterBuild.push(() => {
    const items = [];
    if (!chartConf.nowShown) {
      items.push(`<span class="li"><span class="sw dot"></span>Teraz: ${C(f1(now.t))}, ${P(pct(now.d))}</span>`);
      if (now.target != null) items.push(`<span class="li"><span class="sw ring"></span>Po zastosowaniu: ${P(pct(now.target))}</span>`);
    }
    if (ghost) {
      items.push(`<span class="li"><span class="sw line"></span>Nowa krzywa</span>`);
      items.push(`<span class="li"><span class="sw ghost"></span>W kontrolerze teraz</span>`);
    }
    document.getElementById("legend").innerHTML = items.join("");
  });

  // points: spin buttons whose values can also be typed in; values only in
  // the preview
  const runs = [];
  points.forEach((p, i) => {
    const prev = points[i - 1];
    if (prev && prev[0] === p[0] && prev[1] === p[1]) runs[runs.length - 1][1] = i; else runs.push([i, i]);
  });
  const dup = runs.find(([a, b]) => b > a && b === points.length - 1);
  const spin = (label, value, unit, focus) => `<span class="spin" aria-label="${label}">
      <span class="b"><i data-ic="minus"></i></span><span class="val${focus ? " focus" : ""}">${value}${focus ? '<span class="caret"></span>' : ""}${F.NB}${unit}</span><span class="b"><i data-ic="plus"></i></span></span>`;
  const rows = points.map(([t, d], i) => {
    const cls = ["row", "pt-row", i === selected ? "sel" : "", issues[i] ? "issue" : ""].join(" ");
    const fields = editable
      ? `<div class="pt-fields">${spin(`Punkt ${i + 1}, temperatura`, t, "°C")}${spin(`Punkt ${i + 1}, wypełnienie`, pct(d), "%", i === typing)}</div>`
      : `<div class="pt-ro"><span>${C(t)}</span><span>${P(pct(d))}</span></div>`;
    const issue = issues[i] ? `<div class="pt-issue"><i data-ic="warning"></i>${issues[i]}</div>` : "";
    return `<div class="${cls}"><span class="pt-n">${i + 1}</span>${fields}</div>${issue}`;
  }).join("");
  const dupNote = dup
    ? `<p class="caption dim" style="margin:10px 2px 0">${dup[1] - dup[0] === 1
      ? `Punkt ${dup[1] + 1} jest taki sam jak punkt ${dup[0] + 1}.`
      : `Punkty ${dup[0] + 2}–${dup[1] + 1} są takie same jak punkt ${dup[0] + 1}.`} Kontroler ma zawsze 7 punktów, a krzywa z mniejszą liczbą poziomów powtarza ostatni.</p>`
    : "";

  const info = (ic, t, sub) => `<div class="row"><div class="prefix"><i data-ic="${ic}"></i></div>
    <div class="tb"><div class="t">${t}</div><div class="sub">${sub}</div></div></div>`;

  document.getElementById("content").innerHTML = `<div class="clamp wide">
    ${note ? `<div class="ed-notice">${note}</div>` : ""}
    <div class="card ed-chart">${chart}<div class="legend" id="legend"></div></div>
    <div class="ed-cols">
      <section class="group">
        <div class="group-header">
          <div class="labels"><div class="heading">Punkty</div>
            <div class="desc">${editable ? "Temperatura i wypełnienie nie mogą maleć od punktu do punktu." : "Wartości odczytane z kontrolera płyty."}</div></div>
        </div>
        <div class="boxed-list">${rows}</div>
        ${dupNote}
      </section>
      <div class="stack">
        <section class="group">
          <div class="group-header"><div class="labels"><div class="heading">Źródło temperatury</div>
            ${editable ? `<div class="desc">Wybór źródła wymaga nowszego sterownika jądra.</div>` : ""}</div></div>
          <div class="boxed-list"><div class="row"><div class="prefix"><i data-ic="thermo"></i></div>
            <div class="tb"><div class="t">${F.SOURCE}</div><div class="sub">nct6687 · temp1</div></div>
            <div class="suffix"><i data-ic="lock" class="dim"></i></div></div></div>
        </section>
        <section class="group">
          <div class="group-header"><div class="labels"><div class="heading">Jak działa krzywa</div></div></div>
          <div class="boxed-list">
            ${info("curve", "Między punktami wypełnienie zmienia się liniowo", "Poniżej pierwszego punktu i powyżej ostatniego obowiązuje ich wypełnienie.")}
            ${info("chip", "Krzywą wykonuje kontroler płyty", "Aplikacja ani pomocnik nie muszą przy tym działać.")}
            ${editable ? info("restore", "Zmiana nie jest natychmiastowa", "Po zastosowaniu wentylator dochodzi do nowego wypełnienia stopniowo.") : ""}
            ${editable ? info("keyboard", "Klawiatura", "Wartości można wpisać w polach. Na wykresie Tab wybiera punkt, strzałki przesuwają go o 1 °C albo 1 %, z Shift o 5; Home i End: pierwszy i ostatni punkt.") : ""}
          </div>
        </section>
      </div>
    </div>
  </div>`;
})();
</script>
<script src="wspolne.js"></script>
</body>
</html>
