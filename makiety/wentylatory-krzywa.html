<!doctype html>

<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baseboard – Krzywa wentylatora (makieta)</title>
<link rel="stylesheet" href="wspolne.css">
<link rel="stylesheet" href="wentylatory.css">
</head>
<body data-page="wentylatory-krzywa" data-nav="wentylatory" data-back="1"
      data-title="Wentylator systemowy 1" data-subtitle="Krzywa · SYS_FAN1">

<!--
  M4 preview: AdwNavigationPage pushed from the fan page when the user
  clicks a card in Curve mode. Points and the operating point are
  illustrative; the current CPU temperature (39,8 °C) is a real reading.
-->

<template id="banner">
  <span>Ustawienia działają do restartu komputera</span>
  <span class="btn">Przywróć automat BIOS</span>
</template>

<main id="content" class="page">
  <div class="clamp wide">
    <p class="intro dim">Wypełnienie jest liczone co sekundę z wybranej temperatury. Zmiany zaczną działać po kliknięciu „Zastosuj”.</p>

    <div class="boxed-list" style="margin-bottom:12px">
      <div class="row"><div class="tb"><div class="t">Źródło temperatury</div></div>
        <div class="suffix"><span>Procesor (Tctl)</span><i data-ic="down"></i></div></div>
    </div>

    <div class="card editor">
      <div class="plot" id="plot"></div>
      <div class="points">
        <div class="pt-head"><span></span><span>Temperatura</span><span>Wypełnienie</span><span></span></div>
        <div id="pt-rows"></div>
        <div class="pt-actions">
          <span class="btn"><i data-ic="plus"></i><span>Dodaj punkt</span></span>
          <div class="caption dim">Od 2 do 8 punktów. Powyżej ostatniego punktu wentylator pracuje z jego wypełnieniem.</div>
        </div>
      </div>
    </div>

    <div class="actions">
      <span class="btn">Cofnij zmiany</span>
      <span class="btn suggested">Zastosuj</span>
    </div>
  </div>
</main>

<script>
// Curve editor chart: one series, so no legend; the page title names it.
(function () {
  const pts = [[30, 20], [50, 30], [65, 50], [80, 80], [90, 100]];
  const selected = 2;
  const now = { t: 39.8, d: 25 };
  const emergency = 95;

  const W = 560, H = 312, L = 46, R = 540, T = 14, B = 270;
  const X = t => L + (t - 20) * (R - L) / 80;
  const Y = d => B - d * (B - T) / 100;
  const f1 = v => v.toLocaleString("pl-PL", { maximumFractionDigits: 1, minimumFractionDigits: 1 });

  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Krzywa: wypełnienie wentylatora systemowego 1 w funkcji temperatury procesora">`;
  for (let t = 20; t <= 100; t += 10) {
    s += `<line class="grid" x1="${X(t)}" y1="${T}" x2="${X(t)}" y2="${B}"/>`;
    if (t % 20 === 0) s += `<text class="tick" x="${X(t)}" y="${B + 20}" text-anchor="middle">${t} °C</text>`;
  }
  for (let d = 0; d <= 100; d += 25) {
    s += `<line class="${d === 0 ? "axis" : "grid"}" x1="${L}" y1="${Y(d)}" x2="${R}" y2="${Y(d)}"/>`;
    s += `<text class="tick" x="${L - 8}" y="${Y(d) + 4}" text-anchor="end">${d} %</text>`;
  }
  // area + curve; dashed parts are the values outside the end points
  const first = pts[0], last = pts[pts.length - 1];
  const poly = pts.map(([t, d]) => `${X(t)},${Y(d)}`).join(" ");
  s += `<polygon points="${X(20)},${B} ${X(20)},${Y(first[1])} ${poly} ${X(100)},${Y(last[1])} ${X(100)},${B}"
          fill="var(--accent-bg)" fill-opacity="0.12"/>`;
  s += `<line x1="${X(20)}" y1="${Y(first[1])}" x2="${X(first[0])}" y2="${Y(first[1])}" stroke="var(--accent-bg)" stroke-width="2" stroke-dasharray="4 4"/>`;
  s += `<line x1="${X(last[0])}" y1="${Y(last[1])}" x2="${X(100)}" y2="${Y(last[1])}" stroke="var(--accent-bg)" stroke-width="2" stroke-dasharray="4 4"/>`;
  s += `<polyline points="${poly}" fill="none" stroke="var(--accent-bg)" stroke-width="2" stroke-linejoin="round"/>`;

  // emergency threshold of the source (status color + text label)
  s += `<line x1="${X(emergency)}" y1="${T}" x2="${X(emergency)}" y2="${B}" stroke="var(--error)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  s += `<text x="${X(emergency) - 6}" y="${B - 10}" text-anchor="end" style="fill:var(--error)">Próg awaryjny ${emergency} °C</text>`;

  // current operating point
  s += `<line x1="${X(now.t)}" y1="${B}" x2="${X(now.t)}" y2="${Y(now.d)}" stroke="currentColor" stroke-opacity=".45" stroke-dasharray="2 3"/>`;
  s += `<line x1="${L}" y1="${Y(now.d)}" x2="${X(now.t)}" y2="${Y(now.d)}" stroke="currentColor" stroke-opacity=".45" stroke-dasharray="2 3"/>`;
  s += `<circle cx="${X(now.t)}" cy="${Y(now.d)}" r="5.5" fill="currentColor" stroke="var(--surface)" stroke-width="2"><title>Teraz: ${f1(now.t)} °C, ${now.d} %</title></circle>`;
  const bx = X(now.t) + 10, by = Y(now.d) + 14;
  s += `<rect x="${bx}" y="${by}" width="146" height="24" rx="7" fill="var(--surface)" stroke="currentColor" stroke-opacity=".15"/>`;
  s += `<text x="${bx + 10}" y="${by + 16}">Teraz ${f1(now.t)} °C → ${now.d} %</text>`;

  // points (draggable in the app)
  pts.forEach(([t, d], i) => {
    const sel = i === selected;
    if (sel) s += `<circle cx="${X(t)}" cy="${Y(d)}" r="12" fill="none" stroke="var(--accent-bg)" stroke-opacity=".5" stroke-width="2"/>`;
    s += `<circle cx="${X(t)}" cy="${Y(d)}" r="${sel ? 8 : 7}" fill="var(--accent-bg)" stroke="var(--surface)" stroke-width="2"><title>Punkt ${i + 1}: ${t} °C, ${d} %</title></circle>`;
  });
  s += `</svg>`;
  document.getElementById("plot").innerHTML = s;

  document.getElementById("pt-rows").innerHTML = pts.map(([t, d], i) => `
    <div class="pt-row${i === selected ? " sel" : ""}">
      <span class="n">${i + 1}</span>
      <span class="spin"><span class="b"><i data-ic="minus"></i></span><span class="val">${t} °C</span><span class="b"><i data-ic="plus"></i></span></span>
      <span class="spin"><span class="b"><i data-ic="minus"></i></span><span class="val">${d} %</span><span class="b"><i data-ic="plus"></i></span></span>
      <span class="btn flat image small" title="Usuń punkt"><i data-ic="trash"></i></span>
    </div>`).join("");
})();
</script>
<script src="wspolne.js"></script>
</body>
</html>
